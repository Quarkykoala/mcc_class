services:
  - type: web
    name: mcc-api
    env: node
    buildCommand: npm install --workspaces --include-workspace-root
    startCommand: npm run -w @mcc/api dev
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: CLIENT_URL
        value: https://mcc-web.onrender.com
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: JWT_SECRET
        sync: false
  - type: web
    name: mcc-web
    env: static
    buildCommand: npm run -w web build
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_DEMO_MODE
        value: "true"
      - key: VITE_API_URL
        value: https://mcc-api.onrender.com/api
